worker_processes auto;

events {
    worker_connections 65535;
}

http {
    lua_package_path "/etc/nginx/lua/?.lua;;";
    lua_shared_dict limit_store 64m;

    upstream kafka_rest_proxy {
        server kafka-rest:8082;
        keepalive 256;
    }

    server {
        listen 8080;
        server_name _;

        location = /health {
            return 200 "ok\n";
        }

        location = /collect {
            content_by_lua_file /etc/nginx/lua/collect.lua;
        }

        location = /_kafka/topics/behavior_raw {
            internal;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Content-Type "application/vnd.kafka.json.v2+json";
            proxy_set_header Accept "application/vnd.kafka.v2+json";
            proxy_pass http://kafka_rest_proxy/topics/behavior_raw;
        }
    }
}
